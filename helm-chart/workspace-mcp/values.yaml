# Default values for workspace-mcp
replicaCount: 1

image:
  repository: workspace-mcp
  pullPolicy: IfNotPresent
  # Uses Chart.AppVersion if not specified
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: workspace-mcp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: workspace-mcp-tls
  #    hosts:
  #      - workspace-mcp.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Deployment update strategy. Leave empty for the default RollingUpdate.
# Set type: Recreate when persistence uses a ReadWriteOnce volume — a rolling
# update would deadlock with the new pod waiting on the PVC the old pod holds.
strategy: {}
  # type: Recreate

# Persistent storage, e.g. for the OAuth proxy disk backend so tokens survive
# a restart. When disabled the pod runs fully on emptyDir (ephemeral).
persistence:
  enabled: false
  # Mount an existing PVC instead of creating one from this chart.
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /data
  # subPath: ""
  annotations: {}

# Environment variables for the application
env:
  # Server configuration
  WORKSPACE_MCP_PORT: "8000"
  # Set the base URI for your Kubernetes environment
  # For internal cluster access: "http://{{ include "workspace-mcp.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local"
  # For external access: "https://your-domain.com" or "http://your-ingress-host"
  WORKSPACE_MCP_BASE_URI: ""
  
  # External URL for reverse proxy setups (e.g., "https://your-domain.com")
  # If set, this overrides the base_uri:port combination for OAuth endpoints
  WORKSPACE_EXTERNAL_URL: ""
  
  # OAuth 2.1 support. The chart runs streamable HTTP behind a Kubernetes
  # Service, so OAuth 2.1 is the safe default for network-reachable deployments.
  MCP_ENABLE_OAUTH21: "true"

  # REQUIRED whenever MCP_ENABLE_OAUTH21 is "true": the redirect URIs that
  # dynamically registered MCP clients may use. The server refuses to start if this
  # is empty, because an unset allowlist previously meant "accept any redirect URI"
  # during Dynamic Client Registration -- anyone reaching the registration endpoint
  # could have authorization codes delivered to themselves.
  #
  # Remote entries must be exact HTTPS URLs (no host or path wildcards). Loopback
  # entries may wildcard the port, which RFC 8252 section 7.3 requires for native
  # clients that pick an ephemeral port.
  #
  # Example:
  #   "https://claude.ai/api/mcp/auth_callback,http://127.0.0.1:*/callback"
  WORKSPACE_MCP_ALLOWED_CLIENT_REDIRECT_URIS: ""

  # Browser-origin allowlist. Origin validation matches this list (plus loopback and
  # the vscode-webview: scheme) and no longer accepts "Origin equals Host", which
  # was satisfied by DNS rebinding. Set WORKSPACE_EXTERNAL_URL above, and list any
  # additional hostnames the deployment answers on here.
  # OAUTH_ALLOWED_ORIGINS: "https://your-domain.com,https://alt.your-domain.com"

  # Only for service-account (domain-wide delegation) deployments that also set
  # TRUST_GATEWAY_IDENTITY: the Workspace domains this deployment may impersonate.
  # Required in that combination and validated at startup, because the impersonation
  # subject then varies per request.
  # DWD_ALLOWED_DOMAINS: "corp.example.com"

  # Development only - set to "1" for local development
  OAUTHLIB_INSECURE_TRANSPORT: "0"
  
  # Optional: Google Custom Search
  # GOOGLE_PSE_API_KEY: ""
  # GOOGLE_PSE_ENGINE_ID: ""

# Secret configuration for sensitive data
secrets:
  # Google OAuth credentials (required)
  googleOAuth:
    # Set these values or create secret manually
    clientId: ""
    clientSecret: ""
    # Optional: default user email for single-user setups
    userEmail: ""

# Tool selection - specify which Google Workspace tools to enable
tools:
  enabled: []
  # Available tools: gmail, drive, calendar, docs, sheets, chat, forms, slides, tasks, search
  # Example: ["gmail", "drive", "calendar"]
  # Leave empty to enable all tools

# Tool tier selection - alternative to specifying individual tools
# Options: core, extended, complete
# Leave empty to use default or tools.enabled configuration
toolTier: ""

# Single-user mode configuration
singleUserMode: false

# Command configuration
command:
  # Set disableArgs to true to remove the args section entirely (uses Dockerfile defaults)
  disableArgs: false
  # Override the entire command if needed
  override: []

# Health check configuration
healthCheck:
  enabled: true
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  successThreshold: 1
  failureThreshold: 3

# Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# Network policies
networkPolicy:
  enabled: false
  ingress: []
  egress: []
