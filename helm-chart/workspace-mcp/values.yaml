# Default values for workspace-mcp
replicaCount: 1

image:
  repository: workspace-mcp
  pullPolicy: IfNotPresent
  # Uses Chart.AppVersion if not specified
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: workspace-mcp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: workspace-mcp-tls
  #    hosts:
  #      - workspace-mcp.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables for the application
env:
  # Server configuration
  WORKSPACE_MCP_PORT: "8000"
  # Set the base URI for your Kubernetes environment
  # For internal cluster access: "http://{{ include "workspace-mcp.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local"
  # For external access: "https://your-domain.com" or "http://your-ingress-host"
  WORKSPACE_MCP_BASE_URI: ""
  
  # External URL for reverse proxy setups (e.g., "https://your-domain.com")
  # If set, this overrides the base_uri:port combination for OAuth endpoints
  WORKSPACE_EXTERNAL_URL: ""
  
  # OAuth 2.1 support
  MCP_ENABLE_OAUTH21: "false"
  
  # Development only - set to "1" for local development
  OAUTHLIB_INSECURE_TRANSPORT: "0"
  
  # Optional: Google Custom Search
  # GOOGLE_PSE_API_KEY: ""
  # GOOGLE_PSE_ENGINE_ID: ""

# Secret configuration for sensitive data
secrets:
  # Google OAuth credentials.
  googleOAuth:
    # create: render the inline K8s Secret from the values below. DISABLE on the
    # Verdi platform (verdi.secretProviderClass provides the secret from Key Vault
    # instead — no secret material in git). Default true for upstream/local use.
    create: true
    clientId: ""
    clientSecret: ""
    # Optional: default user email for single-user setups
    userEmail: ""

# --- Verdi platform conventions (ADR-0023/0026/0027). Off by default so the
# upstream chart is unchanged for other users; the Verdi values overlay turns
# these on. See helm-chart/workspace-mcp/values-verdi-dev.yaml. ---
verdi:
  # Azure Workload Identity: the pod federates to Azure with no static creds.
  workloadIdentity:
    enabled: false
    clientId: "" # user-assigned MI client ID (Terraform output gws_mcp_identity_client_id)
    tenantId: ""
  # Secrets from Key Vault via the Secret Store CSI driver (replaces the inline
  # Secret). Projects the named KV secrets into <fullname>-oauth (client-id /
  # client-secret / user-email keys the Deployment reads).
  secretProviderClass:
    enabled: false
    keyvaultName: "" # e.g. kv-verdi-dev-tools
    secrets:
      clientId: "gws-mcp-google-oauth-client-id"
      clientSecret: "gws-mcp-google-oauth-client-secret"
      userEmail: "" # optional KV secret name; empty = not projected
  # Ingress via the platform Gateway (AGC + WAF) HTTPRoute, not a per-app Ingress.
  httpRoute:
    enabled: false
    hostname: ""
    gateway:
      name: platform-gateway
      namespace: ingress

# Tool selection - specify which Google Workspace tools to enable
tools:
  enabled: []
  # Available tools: gmail, drive, calendar, docs, sheets, chat, forms, slides, tasks, search
  # Example: ["gmail", "drive", "calendar"]
  # Leave empty to enable all tools

# Tool tier selection - alternative to specifying individual tools
# Options: core, extended, complete
# Leave empty to use default or tools.enabled configuration
toolTier: ""

# Single-user mode configuration
singleUserMode: false

# Command configuration
command:
  # Set disableArgs to true to remove the args section entirely (uses Dockerfile defaults)
  disableArgs: false
  # Override the entire command if needed
  override: []

# Health check configuration
healthCheck:
  enabled: true
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  successThreshold: 1
  failureThreshold: 3

# Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# Network policies
networkPolicy:
  enabled: false
  ingress: []
  egress: []