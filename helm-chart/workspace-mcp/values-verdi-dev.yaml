# Verdi dev overlay for the workspace-mcp chart.
#
# Turns on the Verdi platform conventions (Workload Identity + Key Vault CSI
# secrets + platform-Gateway HTTPRoute) and pins the values that must match the
# infra side (landing-zones/dev/gws-mcp.tf: the MI federated to
# system:serviceaccount:gws-mcp:workspace-mcp). Referenced by the ArgoCD
# Application in infra's gitops/clusters/dev.

# Image lives in the shared dev ACR (infra landing-zones/dev/acr.tf). AKS pulls it
# NATIVELY via the kubelet managed identity (AcrPull) — no imagePullSecret, no
# token, no cron. (GHCR was dropped: kubelet can't mint tokens from the App key
# like ArgoCD does, and GitHub App tokens are second-class for private-package
# pulls.)
image:
  repository: acrverdideveus2.azurecr.io/google_workspace_mcp
  # tag pinned by the ArgoCD Application (or set here to a released tag).

# Pin the ServiceAccount name so it matches the federated-credential subject
# (system:serviceaccount:gws-mcp:workspace-mcp) and annotate it for Workload
# Identity.
serviceAccount:
  create: true
  name: workspace-mcp
  annotations:
    azure.workload.identity/client-id: c7cda932-72a7-46d5-92f1-227f0048ec31

# Satisfy the namespace's Pod Security "restricted" enforcement. The upstream
# securityContext drops caps + runs non-root but omits two fields "restricted"
# requires; add them here (the deployment templates these from values).
securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Secrets come from Key Vault, NOT an inline Secret.
secrets:
  googleOAuth:
    create: false

# Upstream per-app Ingress stays off (we use the platform Gateway HTTPRoute).
ingress:
  enabled: false

# App workloads run on the Spot workload pool (ADR-0022), not the tainted system
# pool. Tolerate the Spot taint so the pod can land there (and so the cluster
# autoscaler scales the scale-to-zero Spot pool up for it), and select the
# workload pool by its label.
tolerations:
  - key: kubernetes.azure.com/scalesetpriority
    operator: Equal
    value: spot
    effect: NoSchedule
nodeSelector:
  verdi.io/pool: workload-spot

verdi:
  workloadIdentity:
    enabled: true
    clientId: c7cda932-72a7-46d5-92f1-227f0048ec31
    tenantId: 231ca2bb-24c6-425e-9c9a-f30c96d202fe
  secretProviderClass:
    enabled: true
    keyvaultName: kv-verdi-dev-tools
    secrets:
      clientId: gws-mcp-google-oauth-client-id
      clientSecret: gws-mcp-google-oauth-client-secret
      # userEmail left unset (multi-user); set a KV secret name to project it.
  httpRoute:
    enabled: true
    hostname: gws-mcp.dev.verdilabs.io

# Server-side OAuth 2.1 (multi-user), served over HTTPS by the platform Gateway.
#
# This is a HOSTED MCP server that agents (Claude Code / Codex, via the
# verdi-google plugin) connect to over HTTP — there is no localhost callback like
# the standalone/stdio mode has. So the server MUST run the OAuth 2.1 flow:
#   - MCP_ENABLE_OAUTH21=true       → advertise protected-resource metadata +
#     drive the FastMCP GoogleProvider browser flow (per-user auth).
#   - WORKSPACE_MCP_STATELESS_MODE  → the pod has no persistent creds volume;
#     tokens live per-session, not on disk (requires OAuth21; enforced in config).
#   - WORKSPACE_EXTERNAL_URL / GOOGLE_OAUTH_REDIRECT_URI → https, since the
#     platform Gateway now serves this host over TLS (wildcard cert landed). The
#     https redirect URI must ALSO be registered on the Google OAuth Web client
#     (GCP console → Authorized redirect URIs) or Google rejects the callback.
# The Google client SECRET comes from Key Vault (secretProviderClass above), so
# this runs as a CONFIDENTIAL OAuth 2.1 client — no extra signing key needed.
env:
  WORKSPACE_MCP_PORT: "8000"
  WORKSPACE_EXTERNAL_URL: "https://gws-mcp.dev.verdilabs.io"
  MCP_ENABLE_OAUTH21: "true"
  WORKSPACE_MCP_STATELESS_MODE: "true"
  GOOGLE_OAUTH_REDIRECT_URI: "https://gws-mcp.dev.verdilabs.io/oauth2callback"
