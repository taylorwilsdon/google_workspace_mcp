{{- /*
Inline OAuth Secret — DISABLED on the Verdi platform.

On Verdi, secrets come from Azure Key Vault via the Secret Store CSI driver, not
from Helm values (no secret material in git). The SecretProviderClass
(secretproviderclass.yaml) projects the Key Vault secrets into a K8s Secret with
the SAME name (<fullname>-oauth) and keys (client-id / client-secret) the
deployment reads — so this inline Secret is not needed and must not exist (it
would collide with the CSI-managed one).

Set secrets.googleOAuth.create=false (Verdi values) to skip it. Upstream/local
users leave it true (default).
*/ -}}
{{- if .Values.secrets.googleOAuth.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "workspace-mcp.fullname" . }}-oauth
  labels:
    {{- include "workspace-mcp.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.googleOAuth.clientId }}
  client-id: {{ .Values.secrets.googleOAuth.clientId | b64enc }}
  {{- else }}
  {{- fail "Google OAuth Client ID is required. Set values.secrets.googleOAuth.clientId" }}
  {{- end }}
  {{- if .Values.secrets.googleOAuth.clientSecret }}
  client-secret: {{ .Values.secrets.googleOAuth.clientSecret | b64enc }}
  {{- else }}
  {{- fail "Google OAuth Client Secret is required. Set values.secrets.googleOAuth.clientSecret" }}
  {{- end }}
  {{- if .Values.secrets.googleOAuth.userEmail }}
  user-email: {{ .Values.secrets.googleOAuth.userEmail | b64enc }}
  {{- end }}
{{- end }}
