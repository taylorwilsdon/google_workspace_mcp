{{- /*
SecretProviderClass — the Verdi platform secret seam (ADR-0023/0027).

The Secret Store CSI driver (AKS addon) fetches the app's secrets from Azure Key
Vault (kv-verdi-dev-tools, the internal-tools tier) using the app's Workload
Identity, and projects them into a K8s Secret named <fullname>-oauth with the
keys the Deployment reads (client-id / client-secret / user-email). No secret
material in git; the pod authenticates to Key Vault with a federated token, no
static credentials.

Enabled via verdi.secretProviderClass.enabled. The CSI-projected Secret only
materializes once a pod mounts the SPC volume (deployment.yaml mounts it when
enabled).
*/ -}}
{{- if .Values.verdi.secretProviderClass.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "workspace-mcp.fullname" . }}-kv
  labels:
    {{- include "workspace-mcp.labels" . | nindent 4 }}
spec:
  provider: azure
  # Project the Key Vault secrets into ONE K8s Secret with the exact name + keys
  # the Deployment's env valueFrom.secretKeyRef expects (<fullname>-oauth).
  secretObjects:
    - secretName: {{ include "workspace-mcp.fullname" . }}-oauth
      type: Opaque
      data:
        - objectName: {{ .Values.verdi.secretProviderClass.secrets.clientId }}
          key: client-id
        - objectName: {{ .Values.verdi.secretProviderClass.secrets.clientSecret }}
          key: client-secret
        {{- if .Values.verdi.secretProviderClass.secrets.userEmail }}
        - objectName: {{ .Values.verdi.secretProviderClass.secrets.userEmail }}
          key: user-email
        {{- end }}
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.verdi.workloadIdentity.clientId | quote }}
    keyvaultName: {{ .Values.verdi.secretProviderClass.keyvaultName | quote }}
    tenantId: {{ .Values.verdi.workloadIdentity.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.verdi.secretProviderClass.secrets.clientId }}
          objectType: secret
        - |
          objectName: {{ .Values.verdi.secretProviderClass.secrets.clientSecret }}
          objectType: secret
        {{- if .Values.verdi.secretProviderClass.secrets.userEmail }}
        - |
          objectName: {{ .Values.verdi.secretProviderClass.secrets.userEmail }}
          objectType: secret
        {{- end }}
{{- end }}
